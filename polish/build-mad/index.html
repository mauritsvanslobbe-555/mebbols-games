/* ============================================================
   FASE 4 — SCREEN-SHAKE (centrale camera/canvas-offset met decay)
   ============================================================ */
const shake = { x:0, y:0, mag:0, time:0, dur:0 };
function addShake(magnitude, durationMs) {
  shake.mag = Math.max(shake.mag, magnitude);
  shake.dur = Math.max(shake.dur, (durationMs || 250) / 1000);
  shake.time = 0;
}
function updateShake(dt) {
  if (shake.dur <= 0) { shake.x = 0; shake.y = 0; return; }
  shake.time += dt;
  if (shake.time >= shake.dur) {
    shake.x = 0; shake.y = 0; shake.mag = 0; shake.dur = 0;
    return;
  }
  const decay = 1 - shake.time / shake.dur;
  const amp = shake.mag * decay * decay;
  shake.x = (Math.random() * 2 - 1) * amp;
  shake.y = (Math.random() * 2 - 1) * amp;
}

const flash = { alpha:0 };
function triggerFlash(strength) { flash.alpha = strength || 0.8; }
function updateFlash(dt) {
  if (flash.alpha > 0) flash.alpha = Math.max(0, flash.alpha - dt * 9);
}
function drawFlash() {
  if (flash.alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = flash.alpha;
  ctx.fillStyle = PAL.white;
  ctx.fillRect(0, 0, VW, VH);
  ctx.restore();
}

/* ============================================================
   RENDER
   ============================================================ */
const cssCache = {};
function getCss(v) {
  if (cssCache[v]) return cssCache[v];
  const val = getComputedStyle(document.documentElement)
    .getPropertyValue(v).trim();
  cssCache[v] = val;
  return val;
}

// Hemel-gradient (art-bible 7.1) - vervangt de vlakke fill.
function drawSky() {
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, PAL.bgSky);
  sky.addColorStop(1, PAL.bgMid);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, VH);
}
function clearCanvas() {
  drawSky();
}

/* ============================================================
   ART-PASS (FASE 3) - ONDERDEEL-RENDER (drawPart, art-bible 6)
   ============================================================ */
function paintPart(c, partId, w, h, dirtSeed) {
  const rnd = seededRand((dirtSeed || 1) * 2654435761);
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';

  function scrapDirt(showRust, rustCol) {
    const nScratch = 2 + Math.floor(rnd() * 3);
    c.strokeStyle = PAL.inkSoft; c.lineWidth = 2;
    for (let i = 0; i < nScratch; i++) {
      const sx = 5 + rnd() * (w - 10), sy = 6 + rnd() * (h - 12);
      const len = 6 + rnd() * 6, ang = rnd() * Math.PI;
      c.beginPath();
      c.moveTo(sx, sy);
      c.lineTo(sx + Math.cos(ang) * len, sy + Math.sin(ang) * len);
      c.stroke();
    }
    if (showRust && rnd() < 0.55) {
      c.fillStyle = rustCol || PAL.warnShadow;
      const rx = 6 + rnd() * (w - 14), ry = h * 0.5 + rnd() * (h * 0.35);
      c.beginPath();
      c.ellipse(rx, ry, 3.5 + rnd() * 2, 2.5 + rnd() * 1.5, rnd(), 0, Math.PI * 2);
      c.fill();
    }
  }
  function bolt(x, y) {
    c.beginPath(); c.arc(x, y, 2, 0, Math.PI * 2);
    c.fillStyle = PAL.ink; c.fill();
  }

  if (partId === 'chassis') {
    c.beginPath(); c.roundRect(1.5, 1.5, w - 3, h - 3, 4);
    c.fillStyle = PAL.part; c.fill();
    c.save(); c.clip();
    c.fillStyle = PAL.partShadow;
    c.fillRect(0, h * 0.6, w, h * 0.4);
    c.fillStyle = PAL.partLight;
    c.fillRect(0, 1.5, w, h * 0.15);
    scrapDirt(true);
    c.restore();
    bolt(6, 6); bolt(w - 6, 6); bolt(6, h - 6); bolt(w - 6, h - 6);
    c.beginPath(); c.roundRect(1.5, 1.5, w - 3, h - 3, 4);
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();

  } else if (partId === 'motorBasic' || partId === 'motorTurbo') {
    c.beginPath(); c.roundRect(3, 7, w - 6, h - 9, 4);
    c.fillStyle = PAL.motorBody; c.fill();
    c.save(); c.clip();
    c.fillStyle = PAL.motorShadow; c.fillRect(0, h * 0.62, w, h);
    c.restore();
    c.strokeStyle = PAL.ink; c.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const ry = 13 + i * 5;
      c.beginPath(); c.moveTo(6, ry); c.lineTo(w - 6, ry); c.stroke();
    }
    c.beginPath(); c.arc(w * 0.42, 7, 5.5, Math.PI, Math.PI * 2);
    c.fillStyle = PAL.hub; c.fill();
    c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
    c.fillStyle = PAL.metalTyre;
    c.beginPath(); c.roundRect(w - 7, 11, 6, 6, 2); c.fill();
    c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
    bolt(7, h - 7);
    if (partId === 'motorTurbo') {
      c.strokeStyle = PAL.warn; c.lineWidth = 2.4;
      c.beginPath();
      for (let aa = 0; aa < Math.PI * 3.4; aa += 0.3) {
        const rr = 1.5 + aa * 1.0;
        const px = w * 0.5 + Math.cos(aa) * rr, py = h * 0.62 + Math.sin(aa) * rr;
        aa === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
      }
      c.stroke();
      c.beginPath(); c.arc(w * 0.5 - 4, h * 0.5 - 2, 2.6, 0, Math.PI * 2);
      c.fillStyle = PAL.accentLight; c.fill();
    }
    c.beginPath(); c.roundRect(3, 7, w - 6, h - 9, 4);
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();

  } else if (partId === 'weight') {
    c.beginPath(); c.roundRect(2, 2, w - 4, h - 4, 2);
    c.fillStyle = PAL.leadBody; c.fill();
    c.save(); c.clip();
    c.fillStyle = PAL.leadShadow; c.fillRect(0, h * 0.5, w, h);
    c.strokeStyle = PAL.leadEdge; c.lineWidth = 2;
    c.beginPath(); c.moveTo(4, 5); c.lineTo(w - 4, 5); c.stroke();
    c.restore();
    c.fillStyle = PAL.ink;
    c.font = '800 11px ' + FONT_BODY;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('kg', w / 2 + 0.6, h / 2 + 1.4);
    c.fillStyle = PAL.leadEdge;
    c.fillText('kg', w / 2, h / 2);
    c.beginPath(); c.roundRect(2, 2, w - 4, h - 4, 2);
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();

  } else if (partId === 'balloon') {
    const cx = w / 2, by = h * 0.42, bw = w * 0.42, bh = h * 0.46;
    c.beginPath();
    c.ellipse(cx, by, bw, bh, 0, 0, Math.PI * 2);
    c.fillStyle = PAL.balloonBody; c.fill();
    c.save();
    c.beginPath(); c.ellipse(cx, by, bw, bh, 0, 0, Math.PI * 2); c.clip();
    c.fillStyle = PAL.balloonShadow;
    c.fillRect(cx - bw, by + bh * 0.15, bw * 2, bh);
    c.fillStyle = 'rgba(244,236,216,0.8)';
    c.beginPath();
    c.ellipse(cx - bw * 0.35, by - bh * 0.4, bw * 0.3, bh * 0.36, -0.5, 0, Math.PI * 2);
    c.fill();
    c.restore();
    c.beginPath(); c.ellipse(cx, by, bw, bh, 0, 0, Math.PI * 2);
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();
    c.beginPath(); c.moveTo(cx - 3, by + bh);
    c.lineTo(cx + 3, by + bh); c.lineTo(cx, by + bh + 4);
    c.closePath(); c.fillStyle = PAL.balloonBody; c.fill();
    c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
    c.beginPath();
    c.moveTo(cx, by + bh + 4);
    c.bezierCurveTo(cx - 6, h - 8, cx + 6, h - 4, cx, h - 1);
    c.stroke();

  } else if (partId === 'bumper') {
    c.beginPath(); c.roundRect(2, 3, w - 4, h - 6, 8);
    c.fillStyle = PAL.warn; c.fill();
    c.save(); c.clip();
    c.fillStyle = PAL.warnShadow; c.fillRect(0, h * 0.55, w, h);
    c.fillStyle = PAL.warnLight; c.fillRect(0, 3, w, h * 0.16);
    c.fillStyle = PAL.metalTyre;
    for (let i = 1; i <= 4; i++) {
      const gx = (w / 5) * i;
      c.fillRect(gx - 1, 6, 2, h - 12);
    }
    c.restore();
    c.beginPath(); c.roundRect(2, 3, w - 4, h - 6, 8);
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();

  } else if (partId === 'spike') {
    c.beginPath(); c.roundRect(2, h * 0.55, w - 4, h * 0.42, 3);
    c.fillStyle = PAL.partShadow; c.fill();
    c.save(); c.beginPath();
    c.roundRect(2, h * 0.55, w - 4, h * 0.42, 3); c.clip();
    c.fillStyle = PAL.groundShadow;
    c.fillRect(0, h * 0.82, w, h);
    c.restore();
    c.beginPath(); c.roundRect(2, h * 0.55, w - 4, h * 0.42, 3);
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();
    for (let i = 0; i < 3; i++) {
      const nx = w * (0.24 + i * 0.26);
      c.beginPath();
      c.moveTo(nx - 5, h * 0.56);
      c.lineTo(nx, h * 0.2);
      c.lineTo(nx + 5, h * 0.56);
      c.fillStyle = PAL.hub; c.fill();
      c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();
    }
    bolt(6, h - 6); bolt(w - 6, h - 6);

  } else {
    c.beginPath(); c.roundRect(2, 2, w - 4, h - 4, 4);
    c.fillStyle = PAL.part; c.fill();
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();
  }
  c.restore();
}

// Wiel-render - wielen roteren live. (0,0) = centrum.
function paintWheel(c, partId, radius) {
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (partId === 'track') {
    const half = radius;
    c.beginPath();
    c.moveTo(-half, -radius);
    c.lineTo(half, -radius);
    c.arc(half, 0, radius, -Math.PI / 2, Math.PI / 2);
    c.lineTo(-half, radius);
    c.arc(-half, 0, radius, Math.PI / 2, Math.PI * 1.5);
    c.closePath();
    c.fillStyle = PAL.metalTyre; c.fill();
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();
    c.fillStyle = PAL.metalTyreLight;
    for (let i = 0; i < 10; i++) {
      const t = (i / 10) * (half * 2);
      c.fillRect(-half + t, -radius + 1, 4, 3);
      c.fillRect(-half + t, radius - 4, 4, 3);
    }
    for (const tx of [-half, half]) {
      c.beginPath(); c.arc(tx, 0, radius * 0.45, 0, Math.PI * 2);
      c.fillStyle = PAL.hub; c.fill();
      c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
      for (let t = 0; t < 8; t++) {
        const aa = (t / 8) * Math.PI * 2;
        c.beginPath();
        c.moveTo(tx + Math.cos(aa) * radius * 0.45, Math.sin(aa) * radius * 0.45);
        c.lineTo(tx + Math.cos(aa) * radius * 0.6, Math.sin(aa) * radius * 0.6);
        c.lineWidth = 2; c.stroke();
      }
    }
  } else {
    const big = radius > 22;
    c.beginPath(); c.arc(0, 0, radius, 0, Math.PI * 2);
    c.fillStyle = PAL.metalTyre; c.fill();
    c.lineWidth = 3; c.strokeStyle = PAL.ink; c.stroke();
    if (big) {
      c.fillStyle = PAL.metalTyreLight;
      for (let i = 0; i < 16; i++) {
        const aa = (i / 16) * Math.PI * 2;
        c.save(); c.rotate(aa);
        c.fillRect(radius - 4, -2, 4, 4);
        c.restore();
      }
    }
    c.beginPath(); c.arc(0, 0, radius * 0.62, 0, Math.PI * 2);
    c.lineWidth = 2.4; c.strokeStyle = PAL.accent; c.stroke();
    const spokes = big ? 5 : 3;
    const hubR = big ? radius * 0.4 : radius * 0.42;
    c.strokeStyle = PAL.hub; c.lineWidth = big ? 4 : 3;
    for (let i = 0; i < spokes; i++) {
      const aa = (i / spokes) * Math.PI * 2;
      c.beginPath();
      c.moveTo(Math.cos(aa) * hubR, Math.sin(aa) * hubR);
      c.lineTo(Math.cos(aa) * radius * 0.6, Math.sin(aa) * radius * 0.6);
      c.stroke();
    }
    c.beginPath(); c.arc(0, 0, hubR, 0, Math.PI * 2);
    c.fillStyle = PAL.hub; c.fill();
    c.lineWidth = 2; c.strokeStyle = PAL.ink; c.stroke();
  }
  c.restore();
}

// Off-screen pre-render cache voor niet-roterende onderdelen (art-bible 4.6).
const partSprites = {};
function buildPartSprites() {
  const pad = 6;
  for (const part of PARTS) {
    if (part.role === 'wheel') continue;
    const w = part.gw * 32, h = part.gh * 32;
    const cv2 = document.createElement('canvas');
    cv2.width = (w + pad * 2) * 2;
    cv2.height = (h + pad * 2) * 2;
    const c = cv2.getContext('2d');
    c.scale(2, 2);
    c.translate(pad, pad);
    paintPart(c, part.id, w, h, part.gw * 13 + part.gh * 7 + part.cost);
    partSprites[part.id] = { canvas: cv2, w, h, pad, scale: 2 };
  }
}

// Teken een (eventueel) pre-gerenderd onderdeel op schermpx.
function drawPart(c, partId, x, y, dw, dh, rot, dirtSeed) {
  const part = PART_BY_ID[partId];
  if (part && part.role === 'wheel') {
    c.save();
    c.translate(x + dw / 2, y + dh / 2);
    if (rot) c.rotate(rot);
    const scl = Math.min(dw, dh) / (part.radius * 2);
    c.scale(scl, scl);
    paintWheel(c, partId, part.radius);
    c.restore();
    return;
  }
  const spr = partSprites[partId];
  if (spr) {
    c.save();
    c.translate(x + dw / 2, y + dh / 2);
    if (rot) c.rotate(rot);
    const sx = dw / spr.w, sy = dh / spr.h;
    const sp = spr.pad;
    c.drawImage(spr.canvas,
      0, 0, spr.canvas.width, spr.canvas.height,
      (-dw / 2) - sp * sx, (-dh / 2) - sp * sy,
      (spr.w + sp * 2) * sx, (spr.h + sp * 2) * sy);
    c.restore();
  } else {
    c.save();
    c.translate(x + dw / 2, y + dh / 2);
    if (rot) c.rotate(rot);
    c.translate(-dw / 2, -dh / 2);
    c.scale(dw / 32, dh / 32);
    paintPart(c, partId, 32, 32, dirtSeed || 1);
    c.restore();
  }
}

/* ============================================================
   ART-PASS - ACHTERGROND & PARALLAX (art-bible 7)
   ============================================================ */
let groundTile = null, groundPattern = null;
let parallaxFar = null, parallaxNear = null;
const PARALLAX_SEG = 1024;

function makeGroundTile() {
  const t = document.createElement('canvas'); t.width = 256; t.height = 64;
  const g = t.getContext('2d');
  g.fillStyle = PAL.ground; g.fillRect(0, 0, 256, 64);
  g.fillStyle = PAL.groundLight; g.fillRect(0, 0, 256, 6);
  g.fillStyle = PAL.groundAccent;
  g.fillRect(0, 22, 256, 3);
  g.fillRect(0, 40, 256, 2);
  const pebbles = [[18, 34], [60, 48], [110, 30], [150, 52], [200, 38], [238, 46]];
  g.fillStyle = PAL.groundAccent;
  for (const pb of pebbles) { g.beginPath(); g.arc(pb[0], pb[1], 3, 0, 7); g.fill(); }
  g.fillStyle = PAL.groundLight;
  for (const pb of pebbles) { g.beginPath(); g.arc(pb[0] - 1, pb[1] - 1, 1.4, 0, 7); g.fill(); }
  g.fillStyle = PAL.groundShadow; g.fillRect(0, 58, 256, 6);
  return t;
}

function makeParallaxLayer(near) {
  const cv2 = document.createElement('canvas');
  cv2.width = PARALLAX_SEG; cv2.height = 320;
  const g = cv2.getContext('2d');
  const rnd = seededRand(near ? 9173 : 4421);
  const col = near ? '#6a584f' : PAL.bgMid;
  const baseY = near ? 270 : 250;
  g.fillStyle = col;
  if (near) { g.strokeStyle = PAL.inkSoft; g.lineWidth = 2; }
  let x = 0;
  while (x < PARALLAX_SEG) {
    const bw = 70 + rnd() * 130;
    const bh = 70 + rnd() * (near ? 90 : 150);
    const roofType = rnd();
    g.beginPath();
    g.moveTo(x, baseY);
    g.lineTo(x, baseY - bh);
    if (roofType < 0.4) {
      g.lineTo(x + bw / 2, baseY - bh - 26);
      g.lineTo(x + bw, baseY - bh);
    } else if (roofType < 0.7) {
      g.lineTo(x + bw * 0.5, baseY - bh - 16);
      g.lineTo(x + bw * 0.5, baseY - bh);
      g.lineTo(x + bw, baseY - bh - 16);
    } else {
      g.lineTo(x + bw, baseY - bh);
    }
    g.lineTo(x + bw, baseY);
    g.closePath();
    g.fill();
    if (near) g.stroke();
    if (rnd() < 0.4) {
      const cw = 12 + rnd() * 10;
      g.fillRect(x + bw * 0.65, baseY - bh - 40, cw, 40);
    }
    x += bw + (near ? 6 : -10) + rnd() * 30;
  }
  if (!near) {
    const kx = PARALLAX_SEG * 0.62;
    g.lineWidth = 8; g.strokeStyle = col;
    g.beginPath(); g.moveTo(kx, baseY); g.lineTo(kx, baseY - 200); g.stroke();
    g.beginPath(); g.moveTo(kx - 60, baseY - 180);
    g.lineTo(kx + 110, baseY - 200); g.stroke();
  }
  if (near) {
    for (let i = 0; i < 6; i++) {
      const tx = rnd() * PARALLAX_SEG;
      for (let s = 0; s < 3 + Math.floor(rnd() * 3); s++) {
        g.beginPath();
        g.ellipse(tx, baseY - 8 - s * 14, 18, 9, 0, 0, Math.PI * 2);
        g.fill(); g.stroke();
      }
    }
  }
  return cv2;
}

function buildArtAssets() {
  buildPartSprites();
  groundTile = makeGroundTile();
  groundPattern = ctx.createPattern(groundTile, 'repeat-x');
  parallaxFar = makeParallaxLayer(false);
  parallaxNear = makeParallaxLayer(true);
}

function drawParallaxLayer(img, factor, anchorY) {
  if (!img) return;
  const off = -((gameState.camera.x * factor) % PARALLAX_SEG);
  const y = anchorY - img.height;
  for (let i = -1; i <= Math.ceil(VW / PARALLAX_SEG) + 1; i++) {
    ctx.drawImage(img, off + i * PARALLAX_SEG, y);
  }
}

/* ---------- Build-grid render ---------- */
function renderBuild() {
  drawSky();
  drawParallaxLayer(parallaxFar, 0, VH * 0.62);

  const r = buildCanvasRect;
  const cell = GRID.cell * r.scale;

  ctx.save();
  ctx.lineJoin = 'round';
  ctx.fillStyle = PAL.panelDarker;
  ctx.fillRect(r.x - 6, r.y - 6, r.w + 12, r.h + 12);
  ctx.fillStyle = PAL.panelDark;
  ctx.fillRect(r.x, r.y, r.w, r.h);

  ctx.strokeStyle = PAL.inkSoft;
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= GRID.cols; gx++) {
    ctx.beginPath();
    ctx.moveTo(r.x + gx*cell, r.y);
    ctx.lineTo(r.x + gx*cell, r.y + r.h);
    ctx.stroke();
  }
  for (let gy = 0; gy <= GRID.rows; gy++) {
    ctx.beginPath();
    ctx.moveTo(r.x, r.y + gy*cell);
    ctx.lineTo(r.x + r.w, r.y + gy*cell);
    ctx.stroke();
  }
  ctx.restore();

  for (const p of gameState.placed) drawGridPart(p, r, cell);

  if (drag.active && drag.partId) {
    const gp = screenToGrid(drag.px, drag.py);
    const part = PART_BY_ID[drag.partId];
    if (gp) {
      const ok = canPlace(drag.partId, gp.gx, gp.gy);
      const cx = r.x + gp.gx*cell, cy = r.y + gp.gy*cell;
      const cw = part.gw*cell, ch = part.gh*cell;
      ctx.save();
      ctx.fillStyle = ok ? 'rgba(92,191,90,0.30)' : 'rgba(200,51,42,0.30)';
      ctx.fillRect(cx, cy, cw, ch);
      ctx.lineWidth = 2;
      ctx.strokeStyle = ok ? PAL.validGreen : PAL.invalidRed;
      ctx.strokeRect(cx + 1, cy + 1, cw - 2, ch - 2);
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      const gx2 = cx + cw/2, gy2 = cy + ch/2, gr = Math.min(cw, ch) * 0.18;
      if (ok) {
        ctx.strokeStyle = PAL.white;
        ctx.beginPath();
        ctx.moveTo(gx2 - gr, gy2);
        ctx.lineTo(gx2 - gr*0.25, gy2 + gr*0.8);
        ctx.lineTo(gx2 + gr, gy2 - gr*0.8);
        ctx.stroke();
      } else {
        ctx.strokeStyle = PAL.invalidRed;
        ctx.beginPath();
        ctx.moveTo(gx2 - gr, gy2 - gr); ctx.lineTo(gx2 + gr, gy2 + gr);
        ctx.moveTo(gx2 + gr, gy2 - gr); ctx.lineTo(gx2 - gr, gy2 + gr);
        ctx.stroke();
      }
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.75;
      drawPart(ctx, drag.partId, cx, cy - 6, cw, ch, 0, gp.gx + gp.gy);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = 0.7;
      drawPart(ctx, drag.partId,
        drag.px - part.gw*cell/2, drag.py - part.gh*cell/2,
        part.gw*cell, part.gh*cell, 0, 1);
      ctx.restore();
    }
  }
}

function drawGridPart(p, r, cell) {
  const part = PART_BY_ID[p.partId];
  const x = r.x + p.gx*cell, y = r.y + p.gy*cell;
  const w = part.gw*cell, h = part.gh*cell;
  if (p.skeleton) {
    ctx.save();
    drawPart(ctx, p.partId, x, y, w, h, 0, p.gx*7 + p.gy*3 + 1);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = PAL.partShadow;
    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    ctx.globalAlpha = 1;
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 2; ctx.strokeStyle = PAL.white;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);
    ctx.restore();
    return;
  }
  // place-bounce: scale 1.0 -> 1.15 -> 1.0 over de placeT-klok (fase 4)
  if (p.placeT != null && p.placeT < 1) {
    const pb = 1 + 0.15 * Math.sin(p.placeT * Math.PI);
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.scale(pb, pb);
    ctx.translate(-(x + w / 2), -(y + h / 2));
    drawPart(ctx, p.partId, x, y, w, h, 0, p.gx*7 + p.gy*3 + 2);
    ctx.restore();
    return;
  }
  drawPart(ctx, p.partId, x, y, w, h, 0, p.gx*7 + p.gy*3 + 2);
}

/* ---------- Drive world render ---------- */
function worldToScreen(wx, wy) {
  return {
    x: (wx - gameState.camera.x) + VW/2,
    y: (wy - gameState.camera.y) + VH/2,
  };
}

function renderDrive() {
  drawSky();
  drawParallaxLayer(parallaxFar, 0.3, VH * 0.55);
  drawParallaxLayer(parallaxNear, 0.7, VH * 0.62);

  if (!engine) return;
  const lvl = LEVELS[gameState.levelIndex];

  for (const b of (gameState.levelBodies || [])) {
    if (!b.vertices) continue;
    drawObstacle(b);
  }

  drawFinishFlag(lvl);

  const veh = gameState.vehicle;
  if (veh) {
    const cs = worldToScreen(veh.chassis.position.x, GROUND_Y);
    ctx.save();
    ctx.fillStyle = 'rgba(36,26,20,0.28)';
    ctx.beginPath();
    ctx.ellipse(cs.x, cs.y + 4, 70, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    drawVehicle(veh);
  }
}

function drawObstacle(b) {
  const s = worldToScreen(b.position.x, b.position.y);
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (b.circleRadius) {
    ctx.translate(s.x, s.y);
    ctx.beginPath(); ctx.arc(0, 0, b.circleRadius, 0, Math.PI * 2);
    ctx.fillStyle = PAL.ground; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, b.circleRadius, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = PAL.groundLight;
    ctx.fillRect(-b.circleRadius, -b.circleRadius, b.circleRadius * 2, 5);
    ctx.fillStyle = PAL.groundAccent;
    ctx.fillRect(-b.circleRadius, b.circleRadius * 0.3, b.circleRadius * 2, 3);
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, b.circleRadius, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = PAL.groundShadow; ctx.stroke();
    ctx.restore();
    return;
  }
  const v = b.vertices;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const pt of v) {
    if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
    if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
  }
  const w = maxX - minX, h = maxY - minY;
  ctx.translate(s.x, s.y);
  ctx.rotate(b.angle);

  if (b.label === 'mud') {
    ctx.fillStyle = PAL.mud;
    ctx.fillRect(-w/2, -h/2, w, h);
    ctx.strokeStyle = PAL.groundAccent; ctx.lineWidth = 2;
    for (let i = 1; i <= 3; i++) {
      const ry = -h/2 + (h / 4) * i;
      ctx.beginPath();
      for (let x = -w/2; x <= w/2; x += 16)
        x === -w/2 ? ctx.moveTo(x, ry + Math.sin(x*0.1)*2)
                   : ctx.lineTo(x, ry + Math.sin(x*0.1)*2);
      ctx.stroke();
    }
    ctx.fillStyle = '#5a4030';
    ctx.beginPath(); ctx.ellipse(-w*0.2, -h*0.25, 9, 4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w*0.25, -h*0.1, 7, 3, 0, 0, 7); ctx.fill();
  } else if (b.label === 'rubber') {
    const vary = ((b.id || 0) % 5) * 0.04;
    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 6);
    ctx.fillStyle = PAL.warn; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = PAL.warnShadow; ctx.fillRect(-w/2, h*0.1, w, h);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.06 + vary) + ')';
    ctx.fillRect(-w/2, -h/2, w, h*0.2);
    ctx.fillStyle = PAL.metalTyre;
    ctx.fillRect(-w*0.18, -h/2+4, 2, h-8);
    ctx.fillRect(w*0.12, -h/2+4, 2, h-8);
    ctx.restore();
    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 6);
    ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.stroke();
  } else if (b.label === 'spinner') {
    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 4);
    ctx.fillStyle = PAL.part; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = PAL.partShadow; ctx.fillRect(-w/2, 0, w, h);
    ctx.restore();
    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 4);
    ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.stroke();
    for (const bx of [-w*0.35, 0, w*0.35]) {
      ctx.beginPath(); ctx.arc(bx, 0, 2, 0, Math.PI*2);
      ctx.fillStyle = PAL.ink; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, h*0.7, 0, Math.PI*2);
    ctx.fillStyle = PAL.metalTyre; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = PAL.accent;
    ctx.beginPath(); ctx.arc(0, 0, h*0.55, 0, Math.PI*0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, h*0.55, Math.PI, Math.PI*1.5); ctx.stroke();
  } else if (b.label === 'seesaw') {
    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 4);
    ctx.fillStyle = PAL.part; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = PAL.partShadow; ctx.fillRect(-w/2, 0, w, h);
    ctx.restore();
    ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 4);
    ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.arc(i*w*0.2, 0, 2, 0, Math.PI*2);
      ctx.fillStyle = PAL.ink; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2);
    ctx.fillStyle = PAL.metalTyre; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = PAL.ink; ctx.stroke();
  } else {
    if (groundPattern) {
      ctx.save();
      ctx.translate(-w/2, -h/2);
      const offX = -((b.position.x - w/2) % 256);
      ctx.translate(offX, 0);
      ctx.fillStyle = groundPattern;
      ctx.fillRect(-offX, 0, w, h);
      ctx.restore();
    } else {
      ctx.fillStyle = PAL.ground;
      ctx.fillRect(-w/2, -h/2, w, h);
    }
    ctx.fillStyle = PAL.groundLight;
    ctx.fillRect(-w/2, -h/2, w, 4);
    ctx.fillStyle = PAL.groundShadow;
    ctx.fillRect(-w/2, h/2 - 5, w, 5);
    const rnd = seededRand(Math.round(b.position.x) * 131 + 7);
    ctx.strokeStyle = PAL.validGreen; ctx.lineWidth = 2;
    const tufts = Math.max(1, Math.floor(w / 90));
    for (let i = 0; i < tufts; i++) {
      const tx = -w/2 + (w / (tufts + 1)) * (i + 1) + (rnd() - 0.5) * 20;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(tx + k*3, -h/2);
        ctx.lineTo(tx + k*5, -h/2 - 5 - rnd()*3);
        ctx.stroke();
      }
    }
    if (b.renderType === 'ramp') {
      ctx.fillStyle = PAL.part;
      ctx.fillRect(-w/2, -h/2 - 4, w, 5);
      ctx.lineWidth = 2; ctx.strokeStyle = PAL.ink;
      ctx.strokeRect(-w/2, -h/2 - 4, w, 5);
    }
  }
  ctx.restore();
}

function drawFinishFlag(lvl) {
  const base = worldToScreen(SPAWN_X + lvl.length, GROUND_Y);
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.fillStyle = PAL.metalTyre;
  ctx.fillRect(base.x - 3, base.y - 92, 6, 92);
  ctx.lineWidth = 2; ctx.strokeStyle = PAL.ink;
  ctx.strokeRect(base.x - 3, base.y - 92, 6, 92);
  ctx.beginPath();
  ctx.moveTo(base.x + 3, base.y - 90);
  ctx.lineTo(base.x + 36, base.y - 78);
  ctx.lineTo(base.x + 3, base.y - 66);
  ctx.closePath();
  ctx.fillStyle = PAL.warn; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(base.x, base.y - 92, 4, 0, Math.PI * 2);
  ctx.fillStyle = PAL.accent; ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawVehicle(veh) {
  const cell = GRID.cell;
  const ch = veh.chassis;
  ctx.save();
  const cps = worldToScreen(ch.position.x, ch.position.y);
  ctx.translate(cps.x, cps.y);
  ctx.rotate(ch.angle);
  const spawnX = veh.spawnX, spawnY = veh.spawnY;
  for (const p of gameState.placed) {
    const part = PART_BY_ID[p.partId];
    if (part.role === 'wheel') continue;
    const wx = spawnX + (p.gx + part.gw/2) * cell;
    const wy = spawnY + (p.gy + part.gh/2) * cell;
    const lx = wx - ch.position.x, ly = wy - ch.position.y;
    drawPart(ctx, p.partId,
      lx - part.gw*cell/2, ly - part.gh*cell/2,
      part.gw*cell, part.gh*cell, 0, p.gx*7 + p.gy*3 + 2);
  }
  ctx.restore();
  for (const w of veh.wheels) {
    const s = worldToScreen(w.body.position.x, w.body.position.y);
    const d = w.part.radius * 2;
    drawPart(ctx, w.part.id, s.x - w.part.radius, s.y - w.part.radius,
      d, d, w.body.angle, 1);
  }
}

/* ---------- Title-truck (art-bible 8.2) ---------- */
let titleT = 0;
function renderTitleTruck() {
  const tc = document.getElementById('titleCanvas');
  if (!tc) return;
  const c = tc.getContext('2d');
  c.setTransform(2, 0, 0, 2, 0, 0);
  const W = 420, H = 170;
  c.clearRect(0, 0, W, H);
  c.save();
  c.lineJoin = 'round'; c.lineCap = 'round';

  const ledgeY = H - 30;
  c.fillStyle = PAL.part;
  c.fillRect(0, ledgeY, W, 30);
  c.fillStyle = PAL.partShadow;
  c.fillRect(0, ledgeY + 16, W, 14);
  c.lineWidth = 3; c.strokeStyle = PAL.ink;
  c.beginPath(); c.moveTo(0, ledgeY); c.lineTo(W, ledgeY); c.stroke();
  for (let bx = 22; bx < W; bx += 56) {
    c.beginPath(); c.arc(bx, ledgeY + 9, 2.5, 0, Math.PI * 2);
    c.fillStyle = PAL.ink; c.fill();
  }

  const wob = Math.sin(titleT * 1.4) * 1.6;
  c.save();
  c.translate(W / 2, ledgeY - 4 + wob);

  c.fillStyle = 'rgba(36,26,20,0.28)';
  c.beginPath(); c.ellipse(0, 0, 95, 9, 0, 0, Math.PI * 2); c.fill();

  for (const wx of [-58, 58]) {
    c.save();
    c.translate(wx, -34);
    paintWheel(c, 'bigWheel', 34);
    c.restore();
  }
  for (let i = 0; i < 3; i++) {
    drawPart(c, 'chassis', -54 + i * 36, -94, 36, 36, 0, i + 3);
  }
  drawPart(c, 'bumper', 50, -88, 40, 24, 0, 5);
  drawPart(c, 'motorBasic', -14, -126, 34, 34, 0, 7);
  c.fillStyle = PAL.metalTyre;
  c.fillRect(-44, -128, 9, 22);
  c.lineWidth = 2; c.strokeStyle = PAL.ink;
  c.strokeRect(-44, -128, 9, 22);
  for (let p = 0; p < 3; p++) {
    const pf = (titleT * 0.6 + p * 0.4) % 1;
    c.globalAlpha = (1 - pf) * 0.5;
    c.fillStyle = PAL.bgMid;
    c.beginPath();
    c.arc(-40 + pf * 8, -132 - pf * 22, 4 + pf * 7, 0, Math.PI * 2);
    c.fill();
  }
  c.globalAlpha = 1;
  c.restore();
  c.restore();
}

/* ---------- HUD updates ---------- */
function updateDriveHUD() {
  const lvl = LEVELS[gameState.levelIndex];
  const t = gameState.timer;
  document.getElementById('driveTimer').textContent =
    '⏱ ' + t.toFixed(1) + 's';
  const parEl = document.getElementById('drivePar');
  parEl.textContent = '\u{1F3AF} Par ' + lvl.parTime + 's';
  parEl.style.color = t <= lvl.parTime ? 'var(--valid-green)' : 'var(--warn-light)';
}

/* ============================================================
   GAME LOOP - requestAnimationFrame, delta-time
   ============================================================ */
let lastTime = performance.now();
function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  if (gameState.state === 'drive') {
    if (driveStarted) driveUpdate(dt);
    gameState.camera.x += (gameState.cameraTarget.x - gameState.camera.x) * 0.1;
    gameState.camera.y += (gameState.cameraTarget.y - gameState.camera.y) * 0.1;
    updateDriveHUD();
  }

  // Fase 4 — juice-systemen tikken altijd door (ook tijdens result).
  updateParticles(dt);
  updateShake(dt);
  updateFlash(dt);
  if (gameState.state === 'build') {
    for (const pp of gameState.placed)
      if (pp.placeT != null && pp.placeT < 1)
        pp.placeT = Math.min(1, pp.placeT + dt * 5);
  }

  // screen-shake offset op de canvas-transform (met decay).
  ctx.setTransform(DPR, 0, 0, DPR, shake.x * DPR, shake.y * DPR);

  if (gameState.state === 'build') {
    renderBuild();
    renderParticles(false);
  } else if (gameState.state === 'drive' || gameState.state === 'result') {
    renderDrive();
    renderParticles(true);    // wereld-particles (sparks, mud, ringen)
    renderParticles(false);   // scherm-particles (confetti, star-pop)
  } else {
    clearCanvas();
    if (gameState.state === 'title') {
      titleT += dt;
      renderTitleTruck();
    }
  }

  drawFlash();   // witte screen-flash overlay, boven alles

  requestAnimationFrame(loop);
}

/* ---------- init (Fase 3 - art pass; Fase 6 - final polish) ---------- */
buildArtAssets();
requestAnimationFrame(loop);
setState('title');
</script>
