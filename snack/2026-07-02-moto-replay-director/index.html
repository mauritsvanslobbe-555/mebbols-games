<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moto Replay Director</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0a0a14; font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:#fff; }
  #game { display:block; width:100vw; height:100vh; touch-action:none; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; background:rgba(8,8,20,.82); backdrop-filter:blur(4px); z-index:10; }
  .hidden { display:none !important; }
  h1 { font-size:clamp(26px,7vw,52px); font-weight:800; letter-spacing:-1px;
    background:linear-gradient(90deg,#ff5e7e,#ffb14e,#5ee0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h2 { font-size:clamp(20px,5vw,34px); margin-bottom:10px; }
  p { opacity:.85; margin:8px 0; font-size:15px; max-width:420px; }
  .btn { margin:8px; padding:14px 26px; border:none; border-radius:40px; font-size:16px; font-weight:700;
    background:linear-gradient(90deg,#ff5e7e,#ff8a4e); color:#fff; cursor:pointer; box-shadow:0 6px 20px rgba(255,94,126,.35); }
  .btn.alt { background:linear-gradient(90deg,#5ee0ff,#4e8dff); box-shadow:0 6px 20px rgba(78,141,255,.35); }
  .btn:active { transform:scale(.95); }
  .lvls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .score { font-size:clamp(34px,9vw,60px); font-weight:800; color:#ffb14e; margin:6px 0; }
  .best { opacity:.7; font-size:14px; }
  #hud { position:fixed; top:10px; left:12px; z-index:5; font-weight:700; text-shadow:0 2px 6px #000; font-size:15px; }
  #hype { position:fixed; top:10px; right:12px; z-index:5; text-align:right; text-shadow:0 2px 6px #000; }
  #hypebar { width:120px; height:10px; background:rgba(255,255,255,.2); border-radius:6px; overflow:hidden; margin-top:4px; }
  #hypefill { height:100%; width:0%; background:linear-gradient(90deg,#ffb14e,#ff5e7e); transition:width .12s; }
  .tag { display:inline-block; padding:3px 10px; border-radius:20px; background:rgba(94,224,255,.2); font-size:12px; margin:4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"></div>
<div id="hype" class="hidden"><div style="font-size:13px;opacity:.8">HYPE</div><div id="hypeval" style="font-size:22px;font-weight:800">x1</div><div id="hypebar"><div id="hypefill"></div></div></div>

<div id="menu" class="overlay">
  <h1>MOTO REPLAY<br>DIRECTOR</h1>
  <p>Ride, flip, crash. Daarna monteer je je beste moment tot een highlight reel.</p>
  <p class="best" id="menuBest"></p>
  <div class="lvls">
    <button class="btn" data-lvl="0">Level 1</button>
    <button class="btn" data-lvl="1">Level 2</button>
    <button class="btn" data-lvl="2">Level 3</button>
  </div>
  <p style="margin-top:16px;font-size:13px">Gas = omhoog/W · Leun = links/rechts · Touch: links=leunen, rechts=gas</p>
</div>

<div id="crash" class="overlay hidden">
  <h2>CRASH!</h2>
  <p>Je landde op je kop. Terug naar checkpoint.</p>
  <button class="btn" id="crashRestart">Opnieuw</button>
  <button class="btn alt" id="crashMenu">Menu</button>
</div>

<div id="director" class="overlay hidden">
  <h2>DIRECTOR MODE</h2>
  <p>Je top highlight uit deze run:</p>
  <canvas id="replay" width="320" height="180" style="border-radius:12px;background:#111;margin:6px 0"></canvas>
  <div class="score" id="hypeScore">0</div>
  <p class="best" id="dirBest"></p>
  <div id="dirTags"></div>
  <div>
    <button class="btn" id="shareBtn">Deel je moment</button>
    <button class="btn alt" id="nextBtn">Volgende level</button>
    <button class="btn alt" id="retryBtn">Opnieuw</button>
  </div>
</div>

<script>
(function(){
"use strict";
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const hud=document.getElementById('hud'), hypeEl=document.getElementById('hype');
const hypeVal=document.getElementById('hypeval'), hypeFill=document.getElementById('hypefill');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize); resize();

// ---- Level terrain profiles (heightmap generators) ----
const LEVELS=[
  {name:"Green Hills", len:4200, sky:['#3a5cff','#8fd3ff'], gnd:'#3fa34d',
    fn:x=> Math.sin(x*0.006)*70 + Math.sin(x*0.017)*30 },
  {name:"Dune Ramps", len:4800, sky:['#ff8a4e','#ffd36e'], gnd:'#c98a3a',
    fn:x=> Math.sin(x*0.004)*120 + Math.max(0,Math.sin(x*0.02))*90 - 40 },
  {name:"Night City", len:5400, sky:['#1a1040','#5e3aff'], gnd:'#7a2b6e',
    fn:x=> Math.sin(x*0.009)*90 + Math.sin(x*0.03)*55 + Math.sin(x*0.002)*140 }
];

// ---- Game state ----
const S={ mode:'menu', lvl:0, bike:null, cam:0, cp:0, frames:[], sec:[], secScore:0, secTime:0,
  hype:1, combo:0, run:0, best:load('mrd_best',0) };
function load(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function groundY(x){ const L=LEVELS[S.lvl]; return H*0.62 + L.fn(x); }

function newBike(x){ return { x:x, y:groundY(x)-60, vx:0, vy:0, rot:0, vrot:0, onGround:false,
  air:0, wasAir:0, flips:0, spin:0 }; }

function startLevel(l){ S.lvl=l; S.cp=200; S.bike=newBike(S.cp); S.cam=0; S.frames=[]; S.sec=[];
  S.secScore=0; S.secTime=0; S.hype=1; S.combo=0; S.run=performance.now()/1000; S.mode='play';
  hud.classList.remove('hidden'); hypeEl.classList.remove('hidden'); hideAll(); }

// ---- Input ----
const keys={}; let leanTouch=0, gasTouch=false;
window.addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault(); });
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
function touchUpdate(e){ leanTouch=0; gasTouch=false;
  for(const t of e.touches){ if(t.clientX < W/2){ leanTouch = t.clientY<H/2? -1: 1; } else gasTouch=true; } }
cv.addEventListener('touchstart',e=>{e.preventDefault();touchUpdate(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();touchUpdate(e);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();touchUpdate(e);},{passive:false});

function input(){
  const gas = keys['arrowup']||keys['w']||keys[' ']||gasTouch;
  const brake = keys['arrowdown']||keys['s'];
  let lean=0;
  if(keys['arrowleft']||keys['a']) lean-=1;
  if(keys['arrowright']||keys['d']) lean+=1;
  lean += leanTouch;
  return {gas,brake,lean};
}

// ---- Physics ----
const G=1200;
function update(dt){
  const b=S.bike, inp=input();
  // gas / brake
  if(b.onGround){ if(inp.gas) b.vx += 900*dt; if(inp.brake) b.vx -= 700*dt; b.vx *= 0.995; }
  else { if(inp.gas) b.vx += 120*dt; }
  b.vx = Math.max(-100, Math.min(720, b.vx));
  // air rotation control
  if(!b.onGround){ b.vrot += inp.lean * 7 * dt; }
  b.vrot *= 0.985;
  b.rot += b.vrot*dt;
  // gravity
  b.vy += G*dt;
  b.x += b.vx*dt; b.y += b.vy*dt;

  // terrain collision (front+rear wheel sample)
  const gy=groundY(b.x), slope=(groundY(b.x+16)-groundY(b.x-16))/32;
  const wheelY = b.y+30;
  if(wheelY >= gy){
    b.y = gy-30; b.vy=0;
    if(!b.onGround){ // just landed -> evaluate flip / crash
      const rotN = ((b.rot%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      const upside = rotN>Math.PI*0.6 && rotN<Math.PI*1.4;
      if(upside && b.wasAir>0.35){ crash(); return; }
      const flipsDone = Math.round(b.spin/(Math.PI*2));
      if(flipsDone!==0 && b.wasAir>0.3){ addScore(120*Math.abs(flipsDone), (flipsDone<0?'BACKFLIP':'FRONTFLIP')+(Math.abs(flipsDone)>1?' x'+Math.abs(flipsDone):'')); b.flips+=Math.abs(flipsDone); }
      else if(b.wasAir>0.6){ addScore(45, 'BIG AIR'); }
    }
    b.onGround=true; b.air=0; b.spin=0;
    // align to slope gently
    const target=Math.atan(slope); b.rot += (target-b.rot)*0.25; b.vrot*=0.5;
  } else {
    if(b.onGround){ b.spin=0; } b.onGround=false; b.air+=dt; b.wasAir=b.air; b.spin+=b.vrot*dt;
    if(b.air>0.05 && Math.abs(b.vrot)>0.1){ /* accumulating */ }
  }

  // near-miss: fast + close to steep drop ahead while airborne
  if(!b.onGround && b.air>0.4 && Math.abs(slope)>1.4){ addScore(8*dt, null, true); }

  // camera
  S.cam += ((b.x - W*0.32) - S.cam)*0.12;
  if(S.cam<0)S.cam=0;

  // record replay frame (~ every 33ms handled by loop dt)
  S.frames.push({x:b.x, y:b.y, rot:b.rot, t:performance.now()/1000 - S.run});

  // per-second moment scoring
  S.secTime += dt;
  if(S.secTime>=1){ S.sec.push({start:S.frames.length-Math.round(1/dt), end:S.frames.length, score:S.secScore, sec:S.sec.length});
    S.secScore=0; S.secTime-=1; }

  // hype decay
  S.combo = Math.max(0, S.combo - dt*0.6);
  S.hype = 1 + Math.min(5, S.combo);
  hypeVal.textContent='x'+S.hype.toFixed(1);
  hypeFill.style.width=(Math.min(S.combo,5)/5*100)+'%';

  // fall off world
  if(b.y>H+400) crash();
  // finish
  if(b.x>=LEVELS[S.lvl].len) finish();
  // checkpoint every 800px
  const cpX=Math.floor(b.x/800)*800;
  if(cpX>S.cp && b.onGround) S.cp=cpX;
}

function addScore(pts, tag, silent){ const v=pts*S.hype; S.secScore+=v; if(!silent){ S.combo+=1.3; S.hype=1+Math.min(5,S.combo);
  if(tag) flash(tag); } }
let flashTag='', flashT=0;
function flash(t){ flashTag=t; flashT=1; }

function crash(){ S.mode='crash'; hud.classList.add('hidden'); hypeEl.classList.add('hidden'); show('crash'); }
function respawn(){ S.bike=newBike(S.cp); S.mode='play'; hideAll(); hud.classList.remove('hidden'); hypeEl.classList.remove('hidden'); }

function finish(){ S.mode='director'; hud.classList.add('hidden'); hypeEl.classList.add('hidden'); openDirector(); }

// ---- Rendering ----
function drawBike(g,b,scale){
  g.save(); g.translate(b.x, b.y); g.rotate(b.rot); g.scale(scale,scale);
  // frame
  g.strokeStyle='#111'; g.lineWidth=4; g.fillStyle='#ff5e7e';
  g.beginPath(); g.arc(-18,20,11,0,7); g.moveTo(18+11,20); g.arc(18,20,11,0,7); g.stroke(); // wheels
  g.fillStyle='#222'; g.beginPath(); g.arc(-18,20,11,0,7); g.fill(); g.beginPath(); g.arc(18,20,11,0,7); g.fill();
  g.strokeStyle='#5ee0ff'; g.lineWidth=5; g.beginPath(); g.moveTo(-18,20); g.lineTo(2,0); g.lineTo(18,20); g.moveTo(2,0); g.lineTo(14,-4); g.stroke();
  // rider
  g.fillStyle='#ffb14e'; g.beginPath(); g.arc(-2,-14,6,0,7); g.fill();
  g.strokeStyle='#ffb14e'; g.lineWidth=5; g.beginPath(); g.moveTo(-2,-8); g.lineTo(0,2); g.lineTo(14,-4); g.moveTo(0,2); g.lineTo(-16,18); g.stroke();
  g.restore();
}
function drawTerrain(g,camX,vw,vh){
  const L=LEVELS[S.lvl];
  const gr=g.createLinearGradient(0,0,0,vh); gr.addColorStop(0,L.sky[0]); gr.addColorStop(1,L.sky[1]);
  g.fillStyle=gr; g.fillRect(0,0,vw,vh);
  g.fillStyle=L.gnd; g.beginPath(); g.moveTo(0,vh);
  for(let sx=0; sx<=vw; sx+=8){ const wx=sx+camX; g.lineTo(sx, groundY(wx)); }
  g.lineTo(vw,vh); g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.12)';
  g.beginPath(); g.moveTo(0,vh);
  for(let sx=0; sx<=vw; sx+=8){ const wx=sx+camX; g.lineTo(sx, groundY(wx)); }
  g.lineTo(vw, vh); g.closePath();
  g.save(); g.clip(); g.fillRect(0,0,vw,vh*0.62-40); g.restore();
  // finish flag
  const fx=L.len-camX; if(fx>-40 && fx<vw+40){ g.fillStyle='#fff'; g.fillRect(fx,groundY(L.len)-120,6,120);
    for(let i=0;i<6;i++){ g.fillStyle=i%2?'#000':'#fff'; g.fillRect(fx+6,groundY(L.len)-120+i*10,24,10);} }
  // checkpoint marker
  const cx=S.cp-camX; if(cx>0&&cx<vw){ g.fillStyle='rgba(94,224,255,.8)'; g.fillRect(cx,groundY(S.cp)-70,4,70); }
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawTerrain(ctx,S.cam,W,H);
  ctx.save(); ctx.translate(-S.cam,0); drawBike(ctx,S.bike,1); ctx.restore();
  hud.innerHTML='<div>'+LEVELS[S.lvl].name+'</div><div style="font-size:22px">'+Math.round(S.bike.x/LEVELS[S.lvl].len*100)+'%</div>';
  if(flashT>0){ ctx.globalAlpha=Math.min(1,flashT); ctx.fillStyle='#fff'; ctx.font='800 32px sans-serif'; ctx.textAlign='center';
    ctx.fillText(flashTag, W/2, H*0.28); ctx.globalAlpha=1; flashT-=0.02; }
}

// ---- Director / replay ----
const rcv=document.getElementById('replay'), rctx=rcv.getContext('2d');
let bestSec=null, replayFrames=[], rIdx=0, rTotalScore=0;
function openDirector(){
  // finalize last partial second
  if(S.secTime>0) S.sec.push({start:Math.max(0,S.frames.length-Math.round(S.secTime*30)), end:S.frames.length, score:S.secScore, sec:S.sec.length});
  rTotalScore=Math.round(S.sec.reduce((a,s)=>a+s.score,0));
  // top highlight = best-scoring 1s window (fallback: last second)
  bestSec = S.sec.slice().sort((a,b)=>b.score-a.score)[0] || {start:Math.max(0,S.frames.length-30),end:S.frames.length,score:0};
  replayFrames = S.frames.slice(bestSec.start, bestSec.end);
  if(replayFrames.length<2) replayFrames = S.frames.slice(-30);
  rIdx=0;
  const hypeScore = Math.round((bestSec.score + rTotalScore*0.3));
  document.getElementById('hypeScore').textContent = hypeScore.toLocaleString();
  if(hypeScore>S.best){ S.best=hypeScore; save('mrd_best',S.best); }
  document.getElementById('dirBest').textContent='Beste hype ooit: '+S.best.toLocaleString();
  const tags=[]; if(S.bike.flips>0)tags.push(S.bike.flips+' flips'); tags.push('run '+LEVELS[S.lvl].name); tags.push('#motoreplay');
  document.getElementById('dirTags').innerHTML=tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  S.dirHype=hypeScore;
  show('director');
}
function drawReplay(){
  if(!replayFrames.length) return;
  rctx.fillStyle='#0d0d18'; rctx.fillRect(0,0,rcv.width,rcv.height);
  const fr=replayFrames[Math.floor(rIdx)%replayFrames.length];
  // center on frame, scaled
  const sc=0.55, camX=fr.x-rcv.width/(2*sc), camY=fr.y-rcv.height/(2*sc);
  rctx.save(); rctx.scale(sc,sc); rctx.translate(-camX,-camY);
  // ground under replay
  const L=LEVELS[S.lvl]; rctx.fillStyle=L.gnd; rctx.beginPath(); rctx.moveTo(camX,camY+rcv.height/sc);
  for(let x=camX; x<camX+rcv.width/sc; x+=10) rctx.lineTo(x,groundY(x)); rctx.lineTo(camX+rcv.width/sc,camY+rcv.height/sc); rctx.fill();
  drawBike(rctx,{x:fr.x,y:fr.y,rot:fr.rot},1);
  rctx.restore();
  rctx.fillStyle='#ff5e7e'; rctx.font='700 12px sans-serif'; rctx.fillText('● REC  0:0'+Math.floor(rIdx/replayFrames.length%10), 10,20);
  rIdx += 0.5; // playback speed control
}

// ---- Overlays ----
function hideAll(){ ['menu','crash','director'].forEach(id=>document.getElementById(id).classList.add('hidden')); }
function show(id){ hideAll(); document.getElementById(id).classList.remove('hidden'); }
document.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>startLevel(+b.dataset.lvl));
document.getElementById('crashRestart').onclick=respawn;
document.getElementById('crashMenu').onclick=()=>{ S.mode='menu'; hud.classList.add('hidden'); hypeEl.classList.add('hidden'); menuBest(); show('menu'); };
document.getElementById('retryBtn').onclick=()=>startLevel(S.lvl);
document.getElementById('nextBtn').onclick=()=>startLevel((S.lvl+1)%LEVELS.length);
document.getElementById('shareBtn').onclick=()=>{
  const txt='Ik scoorde '+ (S.dirHype||0).toLocaleString() +' hype in Moto Replay Director! Beste moment: '+(bestSec?bestSec.score.toFixed(0):0)+' 🔥 #motoreplay';
  if(navigator.share){ navigator.share({title:'Moto Replay Director',text:txt}).catch(()=>{}); }
  else alert('📤 Highlight geëxporteerd!\n\n'+txt);
};
function menuBest(){ document.getElementById('menuBest').textContent='Beste hype-score: '+S.best.toLocaleString(); }
menuBest();

// ---- Main loop ----
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(S.mode==='play'){ update(dt); render(); }
  else if(S.mode==='director'){ drawReplay(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
