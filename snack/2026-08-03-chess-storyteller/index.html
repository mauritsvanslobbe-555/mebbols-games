<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chess Storyteller</title>
<style>
  :root{ --bg:#141018; --panel:#20182b; --light:#e9dfce; --dark:#7a5a44; --sel:#f2c14e; --tgt:#5bc17f; --ink:#f4eee6; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Georgia,"Times New Roman",serif; background:radial-gradient(circle at 50% 0%,#2a2036,#141018); color:var(--ink); -webkit-tap-highlight-color:transparent; }
  #app{ max-width:560px; margin:0 auto; padding:14px 12px 40px; }
  h1{ text-align:center; font-size:1.5rem; margin:.2em 0 .1em; letter-spacing:.5px; }
  .sub{ text-align:center; opacity:.7; font-size:.8rem; margin:0 0 12px; }
  #themes{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .tbtn{ background:var(--panel); color:var(--ink); border:1px solid #3a2f4a; border-radius:8px; padding:8px 12px; font:inherit; font-size:.82rem; cursor:pointer; }
  .tbtn.on{ background:var(--sel); color:#2a1e10; border-color:var(--sel); font-weight:bold; }
  #board{ width:min(94vw,460px); aspect-ratio:1; margin:0 auto; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); border:5px solid #2a1a12; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.5); touch-action:manipulation; }
  .cell{ display:flex; align-items:center; justify-content:center; font-size:min(9vw,44px); line-height:1; cursor:pointer; user-select:none; position:relative; }
  .light{ background:var(--light); } .dark{ background:var(--dark); }
  .wp{ color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); } .bp{ color:#1a1119; text-shadow:0 1px 1px rgba(255,255,255,.3); }
  .sel{ outline:4px solid var(--sel); outline-offset:-4px; }
  .tgt::after{ content:""; position:absolute; width:30%; height:30%; border-radius:50%; background:var(--tgt); opacity:.75; }
  #status{ text-align:center; margin:12px 0 8px; font-size:.95rem; min-height:1.2em; }
  #story{ background:var(--panel); border:1px solid #34283f; border-radius:10px; padding:8px 14px; min-height:60px; }
  #story p{ margin:.35em 0; font-size:.92rem; line-height:1.35; }
  #story p:last-child{ font-weight:bold; color:var(--sel); }
  #epilog{ position:fixed; inset:0; background:rgba(10,7,14,.94); display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ max-width:420px; text-align:center; }
  .card h2{ font-size:1.6rem; color:var(--sel); margin:.2em 0; }
  .card p{ line-height:1.5; opacity:.92; }
  .go{ margin-top:18px; background:var(--sel); color:#2a1e10; border:0; border-radius:10px; padding:12px 22px; font:inherit; font-weight:bold; font-size:1rem; cursor:pointer; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div id="app">
  <h1>Chess Storyteller</h1>
  <p class="sub">Elke zet wordt een verhaal. Jij speelt wit.</p>
  <div id="themes"></div>
  <div id="board"></div>
  <div id="status"></div>
  <div id="story"></div>
</div>
<div id="epilog" class="hidden"><div class="card">
  <h2 id="epTitle"></h2>
  <p id="epText"></p>
  <button class="go" id="epBtn">Nieuwe partij</button>
</div></div>
<script>
/* Chess Storyteller — narratieve schaak-snack voor mebbols.com.
   OPMERKING: rokade en en-passant zijn bewust weggelaten om de code compact te houden.
   Promotie gaat altijd naar dame. Schaak/schaakmat/pat-detectie is volledig aanwezig. */

// Scenario-thema's: elk stukletter (K,Q,R,B,N,P) krijgt een eigen titel + sfeer-tekst.
var THEMES = {
  hof:{ label:'Middeleeuws hof', plot:'aan het middeleeuwse hof',
    names:{K:'de Koning',Q:'de Koningin',R:'de Burchtheer',B:'de Bisschop',N:'de Ridder',P:'de Schildknaap'} },
  scifi:{ label:'Sci-fi rebellie', plot:'in de sterrenrebellie',
    names:{K:'de Overheerser',Q:'de Admiraal',R:'het Fort-schip',B:'de Drone',N:'de Jager',P:'de Rekruut'} },
  familie:{ label:'Familie-vete', plot:'tijdens de familie-vete',
    names:{K:'Opa',Q:'Tante',R:'Neef',B:'Oom',N:'Nichtje',P:'het kind'} }
};
var GLYPH = {wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',
             bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'};

// Eén simpel state-object.
var S = { board:null, turn:'w', sel:null, over:false, theme:'hof', story:[] };

var boardEl=document.getElementById('board'), statusEl=document.getElementById('status'),
    storyEl=document.getElementById('story'), themesEl=document.getElementById('themes'),
    epEl=document.getElementById('epilog');

function pick(a){ return a[Math.random()*a.length|0]; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function sq(r,c){ return String.fromCharCode(97+c)+(8-r); } // bordcoord -> algebraïsch (a1..h8)

function initBoard(){
  var b=[]; for(var i=0;i<8;i++) b.push([null,null,null,null,null,null,null,null]);
  var back=['R','N','B','Q','K','B','N','R'];
  for(var c=0;c<8;c++){ b[0][c]='b'+back[c]; b[1][c]='bP'; b[6][c]='wP'; b[7][c]='w'+back[c]; }
  return b;
}

// Pseudo-legale zetten (zonder schaak-check). Pion-diagonalen tellen ook als aanval bij check-detectie.
function pseudo(b,r,c){
  var p=b[r][c]; if(!p) return [];
  var col=p[0], t=p[1], mv=[];
  function push(rr,cc){ if(rr<0||rr>7||cc<0||cc>7) return false; var q=b[rr][cc];
    if(!q){ mv.push([rr,cc]); return true; } if(q[0]!==col) mv.push([rr,cc]); return false; }
  function slide(dirs){ for(var i=0;i<dirs.length;i++){ var rr=r+dirs[i][0],cc=c+dirs[i][1];
    while(push(rr,cc)){ rr+=dirs[i][0]; cc+=dirs[i][1]; } } }
  var R=[[1,0],[-1,0],[0,1],[0,-1]], B=[[1,1],[1,-1],[-1,1],[-1,-1]];
  if(t==='P'){
    var d=col==='w'?-1:1, start=col==='w'?6:1;
    if(r+d>=0&&r+d<8&&!b[r+d][c]){ mv.push([r+d,c]); if(r===start&&!b[r+2*d][c]) mv.push([r+2*d,c]); }
    var dcs=[-1,1]; for(var k=0;k<2;k++){ var rr=r+d,cc=c+dcs[k];
      if(rr>=0&&rr<8&&cc>=0&&cc<8){ var q=b[rr][cc]; if(q&&q[0]!==col) mv.push([rr,cc]); } }
  } else if(t==='N'){
    var K=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
    for(var n=0;n<8;n++) push(r+K[n][0],c+K[n][1]);
  } else if(t==='K'){
    var A=R.concat(B); for(var m=0;m<8;m++) push(r+A[m][0],c+A[m][1]);
  } else if(t==='R') slide(R);
  else if(t==='B') slide(B);
  else if(t==='Q') slide(R.concat(B));
  return mv;
}

function kingPos(b,col){ for(var r=0;r<8;r++) for(var c=0;c<8;c++) if(b[r][c]===col+'K') return [r,c]; return null; }

// Staat kleur 'col' in schaak? Elke vijandelijke pseudo-zet die het koningsveld raakt telt.
function inCheck(b,col){
  var k=kingPos(b,col); if(!k) return true; var e=col==='w'?'b':'w';
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){ if(b[r][c]&&b[r][c][0]===e){
    var ms=pseudo(b,r,c); for(var i=0;i<ms.length;i++) if(ms[i][0]===k[0]&&ms[i][1]===k[1]) return true; } }
  return false;
}

function apply(b,fr,fc,tr,tc){
  var nb=[]; for(var i=0;i<8;i++) nb.push(b[i].slice());
  var p=nb[fr][fc]; nb[fr][fc]=null;
  if(p[1]==='P'&&(tr===0||tr===7)) p=p[0]+'Q'; // promotie -> dame
  nb[tr][tc]=p; return nb;
}

// Legale zetten = pseudo-zetten die de eigen koning niet in schaak achterlaten.
function legal(b,r,c){ var p=b[r][c]; if(!p) return [];
  return pseudo(b,r,c).filter(function(m){ return !inCheck(apply(b,r,c,m[0],m[1]),p[0]); }); }
function allLegal(b,col){ var res=[]; for(var r=0;r<8;r++) for(var c=0;c<8;c++)
    if(b[r][c]&&b[r][c][0]===col){ var ms=legal(b,r,c); for(var i=0;i<ms.length;i++) res.push([r,c,ms[i][0],ms[i][1]]); }
  return res; }

// Verhaal-zin voor één zet, in het gekozen thema.
function tell(names,mover,capt,tr,tc,promo,check,mate){
  var nm=names[mover[1]], dest=sq(tr,tc), s;
  if(promo){ s=cap(names.P)+' bereikt '+dest+' en verrijst tot '+names.Q; }
  else if(capt){ s=cap(nm)+' '+pick(['grijpt','verslaat','onttroont','velt'])+' '+names[capt[1]]+' op '+dest; }
  else { s=cap(nm)+' '+pick(['trekt op naar','beweegt naar','manoeuvreert naar','glijdt naar'])+' '+dest; }
  if(mate) s+=' — schaakmat, het pleit is beslecht!';
  else if(check) s+=' — schaak!';
  return s;
}

// Voer een zet uit, vertel hem, en bepaal of de partij eindigt. Retourneert true bij einde.
function doMove(fr,fc,tr,tc){
  var names=THEMES[S.theme].names, mover=S.board[fr][fc], capt=S.board[tr][tc];
  var nb=apply(S.board,fr,fc,tr,tc), promo=mover[1]==='P'&&(tr===0||tr===7), foe=mover[0]==='w'?'b':'w';
  S.board=nb; S.turn=foe; S.sel=null;
  var check=inCheck(nb,foe), noMoves=allLegal(nb,foe).length===0, mate=noMoves&&check, stale=noMoves&&!check;
  S.story.push(tell(names,mover,capt,tr,tc,promo,check,mate));
  if(S.story.length>5) S.story.shift();
  render();
  if(mate||stale){ endGame(mate,mover[0]); return true; }
  return false;
}

// Zwart-AI: greedy capture — pak het waardevolste stuk, anders willekeurige legale zet.
function aiMove(){
  if(S.over) return; var moves=allLegal(S.board,'b'); if(!moves.length) return;
  var val={P:1,N:3,B:3,R:5,Q:9,K:0}, best=-1, cands=[];
  for(var i=0;i<moves.length;i++){ var t=S.board[moves[i][2]][moves[i][3]], v=t?val[t[1]]:0;
    if(v>best){ best=v; cands=[moves[i]]; } else if(v===best) cands.push(moves[i]); }
  var m=pick(cands); doMove(m[0],m[1],m[2],m[3]);
}

function onClick(r,c){
  if(S.over||S.turn!=='w') return; var p=S.board[r][c];
  if(S.sel){
    var t=legal(S.board,S.sel[0],S.sel[1]);
    if(t.some(function(m){ return m[0]===r&&m[1]===c; })){
      if(!doMove(S.sel[0],S.sel[1],r,c)) setTimeout(aiMove,450); return; }
    if(p&&p[0]==='w'){ S.sel=[r,c]; render(); return; }
    S.sel=null; render(); return;
  }
  if(p&&p[0]==='w'&&legal(S.board,r,c).length){ S.sel=[r,c]; render(); }
}

function render(){
  boardEl.innerHTML='';
  var targets=S.sel?legal(S.board,S.sel[0],S.sel[1]):[];
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){
    var d=document.createElement('div');
    d.className='cell '+((r+c)%2?'dark':'light');
    if(S.sel&&S.sel[0]===r&&S.sel[1]===c) d.className+=' sel';
    if(targets.some(function(t){ return t[0]===r&&t[1]===c; })) d.className+=' tgt';
    var p=S.board[r][c]; if(p){ d.textContent=GLYPH[p]; d.className+=(p[0]==='w'?' wp':' bp'); }
    (function(rr,cc){ d.addEventListener('click',function(){ onClick(rr,cc); }); })(r,c);
    boardEl.appendChild(d);
  }
  statusEl.textContent = S.over?'Partij voorbij.':(S.turn==='w'?'Wit (jij) aan zet.':'Zwart denkt na...');
  storyEl.innerHTML = S.story.map(function(s){ return '<p>'+s+'</p>'; }).join('');
}

function endGame(mate,winner){
  S.over=true; var t=THEMES[S.theme], title, txt;
  if(mate){
    var youWin=winner==='w';
    title=youWin?'Jij triomfeert!':'Zwart triomfeert!';
    txt='Zo eindigt de sage '+t.plot+': de '+t.names.K+' van '+(youWin?'de tegenstander':'jouw zijde')
        +' valt. '+(youWin?'Jouw':'De vijandige')+' legende wordt nog generaties doorverteld.';
  } else {
    title='Een patstelling.'; txt='Het verhaal '+t.plot+' stokt: niemand kan nog zetten. '
        +'Geen zege, geen nederlaag — slechts een wapenstilstand die niemand voorzag.';
  }
  document.getElementById('epTitle').textContent=title;
  document.getElementById('epText').textContent=txt;
  epEl.className='';
}

function newGame(){
  S.board=initBoard(); S.turn='w'; S.sel=null; S.over=false;
  S.story=['De partij begint '+THEMES[S.theme].plot+'...'];
  epEl.className='hidden'; render();
}

function setTheme(key){
  S.theme=key;
  try{ localStorage.setItem('cs_theme',key); }catch(e){}
  var kids=themesEl.children; for(var i=0;i<kids.length;i++) kids[i].className='tbtn'+(kids[i].dataset.k===key?' on':'');
  // Herstart bij thema-wissel zodat het verhaal consistent blijft.
  newGame();
}

function buildThemes(){
  Object.keys(THEMES).forEach(function(k){
    var b=document.createElement('button'); b.className='tbtn'; b.dataset.k=k; b.textContent=THEMES[k].label;
    b.addEventListener('click',function(){ setTheme(k); }); themesEl.appendChild(b);
  });
}

document.getElementById('epBtn').addEventListener('click',newGame);
buildThemes();
var saved='hof'; try{ var v=localStorage.getItem('cs_theme'); if(v&&THEMES[v]) saved=v; }catch(e){}
setTheme(saved);
</script>
</body>
</html>
